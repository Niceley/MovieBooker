version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: moviebooker-db
    environment:
      POSTGRES_DB: moviebooker
      POSTGRES_USER: moviebooker
      POSTGRES_PASSWORD: moviebooker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moviebooker"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  api:
    build:
      context: ./moviebooker-api
      dockerfile: Dockerfile
    container_name: moviebooker-api
    environment:
      DATABASE_URL: postgresql://moviebooker:moviebooker@postgres:5432/moviebooker?schema=public
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      NODE_ENV: production
      TMDB_API_KEY: ${TMDB_API_KEY}
      FRONTEND_URL: http://localhost:80
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/documentation"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend
  frontend:
    build:
      context: ./moviebooker-frontend
      dockerfile: Dockerfile
      args:
        API_URL: http://localhost:3000
    container_name: moviebooker-frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:

